<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 50">
  <title>AutoInc</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      text { animation: appear .45s ease-out both; }
      @keyframes appear {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
  <text x="2" y="34" fill="#edf0f2" font-family="system-ui, sans-serif" font-size="27" font-weight="650" letter-spacing="-.6">AutoInc</text>
</svg>
